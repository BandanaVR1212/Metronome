<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metronome</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --text: #2a2118;
    --muted: #7a6a58;
    --line: #e2d8ca;
    --accent: #e0902a;
    --accent-text: #ffffff;
    --chip: #f1e9dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130f;
      --card: #231d17;
      --text: #f3eadd;
      --muted: #a8977f;
      --line: #3a3027;
      --accent: #f0a53a;
      --accent-text: #1c1408;
      --chip: #30271f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 16px; }
  .app { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .02em; text-align: center; }
  .top { position: relative; display: flex; align-items: center; justify-content: center; }
  .fs { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); display: grid; place-items: center; touch-action: manipulation; }
  .fs svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .made { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-top: 4px; }
  h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

  .stage { display: flex; justify-content: center; }
  canvas { width: 100%; max-width: 300px; aspect-ratio: 320 / 440; display: block; }

  .beats { display: flex; justify-content: center; gap: 10px; min-height: 18px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line); transition: background .12s, transform .12s, box-shadow .12s; }
  .dot.first { border-color: var(--accent); }
  .dot.on { background: var(--text); transform: scale(1.25); }
  .dot.first.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  .bpm-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .bpm-display { display: flex; flex-direction: column; align-items: center; min-width: 120px; }
  #bpmInput { width: 120px; font-size: 56px; font-weight: 700; text-align: center; background: transparent; color: var(--text); border: none; outline: none; padding: 0; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  #bpmInput::-webkit-outer-spin-button, #bpmInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .bpm-unit { font-size: 12px; letter-spacing: .2em; color: var(--muted); margin-top: -4px; }
  #tempoName { text-align: center; color: var(--muted); font-style: italic; margin-top: 4px; min-height: 20px; }

  button { font: inherit; color: inherit; cursor: pointer; }
  .round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--chip); font-size: 26px; line-height: 1; display: grid; place-items: center; user-select: none; touch-action: manipulation; }
  .round:active { transform: scale(.94); }

  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; margin: 6px 0 0; }

  .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .primary { background: var(--accent); color: var(--accent-text); border: none; border-radius: 16px; padding: 16px; font-size: 18px; font-weight: 700; touch-action: manipulation; }
  .primary:active { transform: scale(.98); }
  .secondary { background: var(--chip); border: 1px solid var(--line); border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 600; touch-action: manipulation; }
  .secondary:active { transform: scale(.97); }

  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .field.wide { grid-column: 1 / -1; }
  select { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--text); }
  .check { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text); padding: 10px 0; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 300px; overflow-y: auto; padding: 2px; }
  .chip { padding: 12px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--chip); font-size: 14px; text-align: center; touch-action: manipulation; }
  .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Metronome</h1>
    <button class="fs" id="fs" aria-label="Full screen"></button>
  </div>

  <div class="stage"><canvas id="pend"></canvas></div>
  <div class="beats" id="beats" aria-hidden="true"></div>

  <section>
    <div class="bpm-row">
      <button class="round" data-step="-1" aria-label="Slower">−</button>
      <div class="bpm-display">
        <input id="bpmInput" type="number" min="20" max="240" inputmode="numeric" value="100" aria-label="BPM">
        <span class="bpm-unit">BPM</span>
      </div>
      <button class="round" data-step="1" aria-label="Faster">+</button>
    </div>
    <div id="tempoName"></div>
    <input id="bpmSlider" type="range" min="20" max="240" value="100" aria-label="BPM slider">
  </section>

  <div class="actions">
    <button id="toggle" class="primary">Start</button>
    <button id="tap" class="secondary">Tap</button>
  </div>

  <section class="settings">
    <label class="field">Time signature (beats per bar)
      <select id="beatsSel"></select>
    </label>
    <label class="check"><input type="checkbox" id="accent" checked> Accent on beat one</label>
    <label class="field wide">Volume
      <input id="vol" type="range" min="0" max="100" value="80">
    </label>
  </section>

  <section>
    <h2>Sound</h2>
    <div class="chips" id="sounds"></div>
  </section>

  <div class="hint">Space – start/stop · ↑ ↓ – BPM ±1 · ← → – BPM ±5 · F – full screen</div>
  <div class="made">Made by Bandana</div>
</main>

<script>
(() => {
  'use strict';

  const BPM_MIN = 20, BPM_MAX = 240;
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const store = {
    get(k, d) { try { const v = localStorage.getItem('metronome.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('metronome.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  let bpm = clamp(store.get('bpm', 100), BPM_MIN, BPM_MAX);
  let beatsPerBar = store.get('beats', 4);
  let soundId = store.get('sound', 'woodblock');
  let volume = clamp(store.get('vol', 0.8), 0, 1);
  let accentOn = store.get('accent', true);

  let ac = null, master = null, noiseBuf = null;

  function initAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC({ latencyHint: 'interactive' });
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain();
      master.gain.value = volume;
      master.connect(comp);
      comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }

  function tone(t, o) {
    const { type = 'sine', f = 440, f2 = null, dur = 0.1, peak = 1, attack = 0.001 } = o;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f, t);
    if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(master);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }

  function noise(t, o) {
    const { dur = 0.05, peak = 1, type = 'bandpass', f = 2000, q = 1, attack = 0.001 } = o;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const flt = ac.createBiquadFilter();
    flt.type = type; flt.frequency.value = f; flt.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt).connect(g).connect(master);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.03);
  }

  function metal(t, freqs, o) {
    const { dur = 0.3, peak = 0.7, bp = 800, q = 0.8, type = 'square' } = o;
    const flt = ac.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.value = bp; flt.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    flt.connect(g).connect(master);
    freqs.forEach(f => {
      const osc = ac.createOscillator();
      osc.type = type; osc.frequency.value = f;
      osc.connect(flt); osc.start(t); osc.stop(t + dur + 0.03);
    });
  }

  const SOUNDS = [
    { id: 'woodblock', name: 'Wood Block', play(t, a) {
        tone(t, { f: a ? 1500 : 1000, f2: a ? 1250 : 840, dur: 0.07, peak: 0.9 });
        noise(t, { f: a ? 3200 : 2300, q: 2, dur: 0.015, peak: 0.3 });
    }},
    { id: 'click', name: 'Click', play(t, a) {
        noise(t, { type: 'highpass', f: a ? 4500 : 3000, q: 0.7, dur: 0.01, peak: 0.8 });
        tone(t, { f: a ? 3000 : 2200, dur: 0.012, peak: 0.6 });
    }},
    { id: 'mechanical', name: 'Mechanical', play(t, a) {
        noise(t, { f: a ? 3300 : 2400, q: 4, dur: 0.035, peak: 1 });
        tone(t, { f: a ? 230 : 165, f2: a ? 150 : 110, dur: 0.07, peak: 0.6 });
    }},
    { id: 'beep', name: 'Beep', play(t, a) {
        tone(t, { f: a ? 1320 : 880, dur: 0.1, peak: 0.6 });
    }},
    { id: 'electronic', name: 'Electronic', play(t, a) {
        const f = a ? 1568 : 1046;
        tone(t, { type: 'square', f, dur: 0.07, peak: 0.22 });
        tone(t, { f, dur: 0.08, peak: 0.5 });
    }},
    { id: 'blip', name: 'Digital Blip', play(t, a) {
        tone(t, { type: 'square', f: a ? 900 : 600, f2: a ? 1350 : 900, dur: 0.05, peak: 0.2 });
    }},
    { id: '8bit', name: '8-Bit', play(t, a) {
        tone(t, { type: 'square', f: a ? 988 : 659, dur: 0.05, peak: 0.2 });
        tone(t + 0.05, { type: 'square', f: a ? 1319 : 988, dur: 0.09, peak: 0.2 });
    }},
    { id: 'laser', name: 'Laser', play(t, a) {
        tone(t, { type: 'sawtooth', f: a ? 2600 : 2000, f2: 200, dur: 0.12, peak: 0.28 });
    }},
    { id: 'pop', name: 'Pop', play(t, a) {
        tone(t, { f: a ? 1000 : 800, f2: 180, dur: 0.06, peak: 1 });
    }},
    { id: 'drop', name: 'Water Drop', play(t, a) {
        tone(t, { f: a ? 600 : 420, f2: a ? 1600 : 1100, dur: 0.09, peak: 0.8 });
    }},
    { id: 'snap', name: 'Finger Snap', play(t, a) {
        noise(t, { f: a ? 2600 : 2200, q: 5, dur: 0.045, peak: 0.9 });
        tone(t, { f: a ? 1600 : 1400, f2: 700, dur: 0.03, peak: 0.4 });
    }},
    { id: 'clap', name: 'Clap', play(t, a) {
        [0, 0.011, 0.022].forEach(d => noise(t + d, { f: 1200, q: 0.8, dur: 0.02, peak: 0.6 }));
        noise(t + 0.032, { f: a ? 1500 : 1200, q: 0.9, dur: a ? 0.2 : 0.14, peak: a ? 0.7 : 0.5 });
    }},
    { id: 'clap808', name: '808 Clap', play(t, a) {
        [0, 0.009, 0.018, 0.027].forEach(d => noise(t + d, { f: 1000, q: 1.2, dur: 0.018, peak: 0.7 }));
        noise(t + 0.036, { f: a ? 1100 : 900, q: 1, dur: a ? 0.28 : 0.2, peak: 0.55 });
    }},
    { id: 'sticks', name: 'Sticks', play(t, a) {
        noise(t, { f: a ? 5000 : 4300, q: 3, dur: 0.02, peak: 0.8 });
        tone(t, { type: 'triangle', f: a ? 1900 : 1600, dur: 0.03, peak: 0.7 });
    }},
    { id: 'sidestick', name: 'Side Stick', play(t, a) {
        tone(t, { type: 'triangle', f: a ? 520 : 420, dur: 0.045, peak: 0.9 });
        noise(t, { f: a ? 2800 : 2400, q: 2, dur: 0.03, peak: 0.6 });
    }},
    { id: 'rimshot', name: 'Rimshot', play(t, a) {
        tone(t, { type: 'triangle', f: a ? 520 : 440, f2: 300, dur: 0.07, peak: 0.8 });
        tone(t, { f: a ? 1900 : 1700, dur: 0.025, peak: 0.6 });
        noise(t, { f: 3500, q: 2, dur: 0.05, peak: 0.7 });
    }},
    { id: 'snare', name: 'Snare', play(t, a) {
        noise(t, { type: 'highpass', f: 1500, q: 0.8, dur: a ? 0.16 : 0.11, peak: a ? 0.9 : 0.65 });
        tone(t, { type: 'triangle', f: a ? 240 : 200, f2: 120, dur: 0.09, peak: 0.6 });
    }},
    { id: 'kick', name: 'Kick', play(t, a) {
        tone(t, { f: a ? 190 : 145, f2: 42, dur: 0.2, peak: 1 });
        noise(t, { type: 'lowpass', f: 900, q: 0.7, dur: 0.02, peak: 0.4 });
    }},
    { id: 'kick808', name: '808 Kick', play(t, a) {
        tone(t, { f: a ? 150 : 120, f2: 38, dur: 0.45, peak: 1 });
    }},
    { id: 'tom', name: 'Tom', play(t, a) {
        tone(t, { f: a ? 220 : 170, f2: a ? 110 : 80, dur: 0.26, peak: 1 });
        noise(t, { type: 'lowpass', f: 1200, q: 0.7, dur: 0.02, peak: 0.35 });
    }},
    { id: 'hihat', name: 'Hi-Hat', play(t, a) {
        noise(t, { type: 'highpass', f: 7000, q: 0.7, dur: a ? 0.14 : 0.05, peak: a ? 0.9 : 0.6 });
        noise(t, { f: 10000, q: 1, dur: a ? 0.1 : 0.04, peak: 0.4 });
    }},
    { id: 'openhat', name: 'Open Hat', play(t, a) {
        noise(t, { type: 'highpass', f: 7000, q: 0.7, dur: a ? 0.35 : 0.25, peak: a ? 0.7 : 0.55 });
        noise(t, { f: 9500, q: 1, dur: 0.2, peak: 0.3 });
    }},
    { id: 'ride', name: 'Ride Cymbal', play(t, a) {
        noise(t, { f: 6000, q: 0.6, dur: a ? 0.6 : 0.45, peak: 0.35 });
        tone(t, { f: a ? 4700 : 4300, dur: 0.4, peak: 0.1 });
        tone(t, { f: a ? 6200 : 5700, dur: 0.3, peak: 0.1 });
    }},
    { id: 'cowbell', name: 'Cowbell', play(t, a) {
        const k = a ? 1.2 : 1;
        metal(t, [540 * k, 800 * k], { dur: a ? 0.35 : 0.22, bp: 820 * k });
    }},
    { id: 'agogo', name: 'Agogo', play(t, a) {
        const k = a ? 1.25 : 1;
        metal(t, [880 * k, 1330 * k], { dur: 0.25, peak: 0.6, bp: 1100 * k, q: 1.2, type: 'triangle' });
    }},
    { id: 'conga', name: 'Conga', play(t, a) {
        tone(t, { f: a ? 380 : 320, f2: a ? 330 : 270, dur: 0.16, peak: 1 });
        noise(t, { f: 900, q: 1, dur: 0.012, peak: 0.4 });
    }},
    { id: 'bongo', name: 'Bongo', play(t, a) {
        tone(t, { f: a ? 560 : 470, f2: a ? 500 : 410, dur: 0.1, peak: 1 });
        noise(t, { f: 1500, q: 1, dur: 0.01, peak: 0.4 });
    }},
    { id: 'claves', name: 'Claves', play(t, a) {
        const f = a ? 3000 : 2500;
        tone(t, { f, dur: 0.09, peak: 0.8 });
        tone(t, { f: f * 1.02, dur: 0.05, peak: 0.4 });
    }},
    { id: 'tambourine', name: 'Tambourine', play(t, a) {
        noise(t, { f: 8000, q: 2, dur: 0.12, peak: a ? 0.8 : 0.6 });
        noise(t + 0.01, { type: 'highpass', f: 6000, q: 0.7, dur: a ? 0.25 : 0.18, peak: 0.4 });
    }},
    { id: 'shaker', name: 'Shaker', play(t, a) {
        noise(t, { f: 6000, q: 0.8, dur: 0.09, peak: a ? 0.8 : 0.55, attack: 0.02 });
    }},
    { id: 'maracas', name: 'Maracas', play(t, a) {
        noise(t, { f: 5500, q: 1.2, dur: 0.055, peak: a ? 0.9 : 0.6, attack: 0.008 });
        noise(t + 0.03, { f: 6500, q: 1.2, dur: 0.04, peak: 0.35 });
    }},
    { id: 'triangle', name: 'Triangle', play(t, a) {
        const f = a ? 3300 : 3000;
        tone(t, { f, dur: 0.9, peak: 0.3 });
        tone(t, { f: f * 2.63, dur: 0.4, peak: 0.1 });
    }},
    { id: 'bell', name: 'Bell', play(t, a) {
        const f = a ? 1320 : 880;
        tone(t, { f, dur: 0.6, peak: 0.55 });
        tone(t, { f: f * 2.76, dur: 0.35, peak: 0.22 });
        tone(t, { f: f * 5.4, dur: 0.15, peak: 0.1 });
    }},
    { id: 'chime', name: 'Chime', play(t, a) {
        const f = a ? 2349 : 1760;
        tone(t, { f, dur: 1, peak: 0.35 });
        tone(t, { f: f * 2.01, dur: 0.6, peak: 0.15 });
    }},
    { id: 'glockenspiel', name: 'Glockenspiel', play(t, a) {
        const f = a ? 2093 : 1568;
        tone(t, { f, dur: 0.55, peak: 0.5 });
        tone(t, { f: f * 4, dur: 0.15, peak: 0.2 });
        tone(t, { f: f * 6.3, dur: 0.08, peak: 0.1 });
    }},
    { id: 'xylophone', name: 'Xylophone', play(t, a) {
        const f = a ? 1319 : 1047;
        tone(t, { f, dur: 0.2, peak: 0.8 });
        tone(t, { f: f * 3, dur: 0.04, peak: 0.3 });
    }},
    { id: 'marimba', name: 'Marimba', play(t, a) {
        const f = a ? 784 : 523;
        tone(t, { f, dur: 0.32, peak: 0.9 });
        tone(t, { f: f * 4, dur: 0.06, peak: 0.3 });
    }},
    { id: 'kalimba', name: 'Kalimba', play(t, a) {
        const f = a ? 659 : 523;
        tone(t, { f, dur: 0.5, peak: 0.7 });
        tone(t, { f: f * 5.4, dur: 0.05, peak: 0.15 });
    }},
    { id: 'piano', name: 'Piano', play(t, a) {
        const f = a ? 784 : 523;
        tone(t, { type: 'triangle', f, dur: 0.7, peak: 0.5 });
        tone(t, { f: f * 2, dur: 0.5, peak: 0.25 });
        tone(t, { f: f * 3, dur: 0.3, peak: 0.1 });
    }},
  ];
  const soundById = id => SOUNDS.find(s => s.id === id) || SOUNDS[0];
  if (!SOUNDS.some(s => s.id === soundId)) soundId = SOUNDS[0].id;

  let running = false, timer = null;
  let nextNoteTime = 0, beatIdx = 0, barPos = 0;
  let queue = [];
  let lastBeat = { time: 0, idx: -1 };
  const LOOKAHEAD = 0.12;

  function scheduler() {
    while (nextNoteTime < ac.currentTime + LOOKAHEAD) {
      const acc = accentOn && barPos === 0;
      soundById(soundId).play(nextNoteTime, acc);
      queue.push({ time: nextNoteTime, idx: beatIdx, pos: barPos });
      nextNoteTime += 60 / bpm;
      beatIdx++;
      barPos = (barPos + 1) % beatsPerBar;
    }
  }

  const AMP = 24 * Math.PI / 180;
  let theta = AMP * 0.9, w = 0;
  let startAngle = 0, startW = 0, startWall = 0;

  function driven(now) {
    const next = queue.length ? queue[0].time : nextNoteTime;
    const prev = lastBeat.time;
    const span = Math.max(0.001, next - prev);
    const f = clamp((now - prev) / span, 0, 1);
    const s = lastBeat.idx % 2 === 0 ? 1 : -1;
    return {
      th: AMP * s * Math.cos(Math.PI * f),
      w: -AMP * s * Math.PI * Math.sin(Math.PI * f) / span
    };
  }

  function start() {
    initAudio();
    const interval = 60 / bpm;
    const now = ac.currentTime;
    const t0 = now + Math.min(interval / 2, 0.3);
    lastBeat = { time: t0 - interval, idx: -1 };
    queue = [];
    nextNoteTime = t0;
    beatIdx = 0; barPos = 0;
    startAngle = theta; startW = w; startWall = performance.now();
    running = true;
    timer = setInterval(scheduler, 25);
    scheduler();
    $('toggle').textContent = 'Stop';
  }

  function stop() {
    if (!running) return;
    running = false;
    clearInterval(timer);
    queue = [];
    document.querySelectorAll('.dot.on').forEach(d => d.classList.remove('on'));
    $('toggle').textContent = 'Start';
  }

  function toggle() { running ? stop() : start(); }

  const cv = $('pend');
  const c = cv.getContext('2d');
  const W = 320, H = 440, PX = 160, PY = 352;
  const D_MAX = 265, D_MIN = 60;
  const dOf = b => D_MAX - (Math.log(b) - Math.log(BPM_MIN)) / (Math.log(BPM_MAX) - Math.log(BPM_MIN)) * (D_MAX - D_MIN);
  let bobD = dOf(bpm);

  function setupCanvas() {
    const dpr = Math.max(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw() {
    c.clearRect(0, 0, W, H);

    c.fillStyle = 'rgba(0,0,0,.18)';
    c.beginPath(); c.ellipse(PX, 432, 135, 8, 0, 0, Math.PI * 2); c.fill();

    const g = c.createLinearGradient(30, 0, 290, 0);
    g.addColorStop(0, '#5d3a1a'); g.addColorStop(0.45, '#a06f3b'); g.addColorStop(1, '#4f3016');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(120, 128); c.lineTo(200, 128); c.lineTo(292, 422); c.lineTo(28, 422); c.closePath();
    c.fill();
    c.strokeStyle = '#2f1d0c'; c.lineWidth = 2; c.stroke();

    c.fillStyle = 'rgba(255,230,190,.12)';
    c.beginPath(); c.moveTo(122, 132); c.lineTo(138, 132); c.lineTo(75, 418); c.lineTo(48, 418); c.closePath(); c.fill();

    const pg = c.createLinearGradient(0, 150, 0, 410);
    pg.addColorStop(0, '#3b2410'); pg.addColorStop(1, '#4a2f16');
    c.fillStyle = pg;
    c.beginPath(); c.moveTo(133, 150); c.lineTo(187, 150); c.lineTo(262, 405); c.lineTo(58, 405); c.closePath(); c.fill();

    c.fillStyle = '#150c04';
    c.fillRect(PX - 5, 150, 10, PY - 150);

    c.fillStyle = '#2b1a0a';
    c.beginPath(); c.roundRect(18, 420, 284, 16, 5); c.fill();

    c.save();
    c.translate(PX, PY);
    c.rotate(theta);

    const rg = c.createLinearGradient(-5, 0, 5, 0);
    rg.addColorStop(0, '#9aa0a8'); rg.addColorStop(0.5, '#f1f3f5'); rg.addColorStop(1, '#868c94');
    c.fillStyle = rg;
    c.fillRect(-5, -290, 10, 340);

    const cg = c.createRadialGradient(-3, 30, 1, 0, 34, 11);
    cg.addColorStop(0, '#9aa0a8'); cg.addColorStop(1, '#40454c');
    c.fillStyle = cg;
    c.beginPath(); c.arc(0, 36, 10, 0, Math.PI * 2); c.fill();

    const y = -bobD;
    const wg = c.createLinearGradient(-18, 0, 18, 0);
    wg.addColorStop(0, '#9a6d12'); wg.addColorStop(0.45, '#f3d27a'); wg.addColorStop(1, '#8a5f0c');
    c.fillStyle = wg;
    c.beginPath();
    c.moveTo(-18, y + 16); c.lineTo(18, y + 16); c.lineTo(11, y - 16); c.lineTo(-11, y - 16); c.closePath();
    c.fill();
    c.strokeStyle = '#4d3406'; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = '#3b2704'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-14, y); c.lineTo(14, y); c.stroke();

    c.restore();

    const pgR = c.createRadialGradient(PX - 3, PY - 3, 1, PX, PY, 10);
    pgR.addColorStop(0, '#e9d9a8'); pgR.addColorStop(1, '#6c5320');
    c.fillStyle = pgR;
    c.beginPath(); c.arc(PX, PY, 10, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#3a2a0c'; c.lineWidth = 1.5; c.stroke();
  }

  let lastFrame = performance.now();
  function frame(nowMs) {
    const dt = Math.min(0.05, (nowMs - lastFrame) / 1000);
    lastFrame = nowMs;

    if (running && ac) {
      const now = ac.currentTime;
      while (queue.length && queue[0].time <= now) {
        lastBeat = queue.shift();
        flashBeat(lastBeat.pos);
      }
      const d = driven(now);
      let b = Math.min(1, (nowMs - startWall) / 300);
      b = b * b * (3 - 2 * b);
      theta = startAngle * (1 - b) + d.th * b;
      w = startW * (1 - b) + d.w * b;
    } else {
      const om = Math.PI * bpm / 60;
      w += (-om * om * theta - 3.2 * w) * dt;
      theta += w * dt;
    }

    bobD += (dOf(bpm) - bobD) * Math.min(1, dt * 12);
    draw();
    requestAnimationFrame(frame);
  }

  function buildDots() {
    const box = $('beats');
    box.innerHTML = '';
    for (let i = 0; i < beatsPerBar; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 && accentOn ? ' first' : '');
      box.appendChild(d);
    }
  }
  function flashBeat(pos) {
    const dots = $('beats').children;
    for (let i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === pos);
  }

  const TEMPOS = [[40, 'Grave'], [60, 'Largo'], [66, 'Larghetto'], [76, 'Adagio'], [108, 'Andante'],
                  [120, 'Moderato'], [156, 'Allegro'], [176, 'Vivace'], [200, 'Presto'], [999, 'Prestissimo']];
  function tempoName(b) { return TEMPOS.find(t => b < t[0])[1]; }

  function setBpm(v, fromInput) {
    v = clamp(Math.round(v), BPM_MIN, BPM_MAX);
    bpm = v;
    if (!fromInput) $('bpmInput').value = v;
    $('bpmSlider').value = v;
    $('tempoName').textContent = tempoName(v);
    store.set('bpm', v);
  }

  $('bpmSlider').addEventListener('input', e => setBpm(+e.target.value));
  $('bpmInput').addEventListener('input', e => {
    const v = parseInt(e.target.value, 10);
    if (!isNaN(v) && v >= BPM_MIN && v <= BPM_MAX) setBpm(v, true);
  });
  $('bpmInput').addEventListener('change', () => setBpm(+$('bpmInput').value || bpm));
  $('bpmInput').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

  document.querySelectorAll('.round').forEach(btn => {
    const step = +btn.dataset.step;
    let to = null, iv = null;
    const clear = () => { clearTimeout(to); clearInterval(iv); };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      setBpm(bpm + step);
      to = setTimeout(() => { iv = setInterval(() => setBpm(bpm + step), 70); }, 400);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, clear));
  });

  let taps = [];
  $('tap').addEventListener('click', () => {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length > 7) taps.shift();
    if (taps.length >= 2) {
      const iv = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
      setBpm(60000 / iv);
    }
  });

  const sel = $('beatsSel');
  for (let i = 1; i <= 12; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = i === 1 ? '1 (no bar)' : i + '/4';
    sel.appendChild(o);
  }
  sel.value = beatsPerBar;
  sel.addEventListener('change', () => {
    beatsPerBar = +sel.value;
    barPos = 0;
    store.set('beats', beatsPerBar);
    buildDots();
  });

  $('vol').value = Math.round(volume * 100);
  $('vol').addEventListener('input', e => {
    volume = e.target.value / 100;
    if (master) master.gain.setTargetAtTime(volume, ac.currentTime, 0.01);
    store.set('vol', volume);
  });

  $('accent').checked = accentOn;
  $('accent').addEventListener('change', e => {
    accentOn = e.target.checked;
    store.set('accent', accentOn);
    buildDots();
  });

  const soundsBox = $('sounds');
  function renderSounds() {
    soundsBox.innerHTML = '';
    SOUNDS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'chip' + (s.id === soundId ? ' active' : '');
      b.textContent = s.name;
      b.addEventListener('click', () => {
        soundId = s.id;
        store.set('sound', soundId);
        renderSounds();
        initAudio();
        s.play(ac.currentTime + 0.02, false);
        s.play(ac.currentTime + 0.5, accentOn);
      });
      soundsBox.appendChild(b);
    });
  }

  window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' && e.target.type === 'number') return;
    if (tag === 'select') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setBpm(bpm + 1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setBpm(bpm - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setBpm(bpm + 5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); setBpm(bpm - 5); }
    else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFs(); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });

  $('toggle').addEventListener('click', e => { e.currentTarget.blur(); toggle(); });

  const fsBtn = $('fs');
  const fsRoot = document.documentElement;
  const reqFs = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
  const exitFs = document.exitFullscreen || document.webkitExitFullscreen;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const ICON_ENTER = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_EXIT = '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

  function syncFs() {
    fsBtn.innerHTML = isFs() ? ICON_EXIT : ICON_ENTER;
    fsBtn.setAttribute('aria-label', isFs() ? 'Exit full screen' : 'Full screen');
  }
  function toggleFs() {
    if (!reqFs) return;
    if (isFs()) exitFs.call(document);
    else reqFs.call(fsRoot);
  }
  if (!reqFs) fsBtn.style.display = 'none';
  fsBtn.addEventListener('click', e => { e.currentTarget.blur(); toggleFs(); });
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);
  syncFs();

  setupCanvas();
  setBpm(bpm);
  buildDots();
  renderSounds();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
